services:
  api:
    build:
      context: ./backend
    environment:
      ADAM_DATA_DIR: /data
      ADAM_OPENCODE_API_KEY_FILE: /run/secrets/opencode_api_key
      ADAM_OPENCODE_MODEL: ${ADAM_OPENCODE_MODEL:-gpt-6.1-sol}
      ADAM_SEARCH_BASE_URL: http://search:8080
      ADAM_CORS_ORIGINS: http://localhost:${ADAM_WEB_PORT:-3000},http://127.0.0.1:${ADAM_WEB_PORT:-3000}
      # Sign in with ChatGPT: the redirect URI uses the host port; the listener binds 1455 in the container.
      ADAM_CHATGPT_CALLBACK_PORT: ${ADAM_CHATGPT_CALLBACK_PORT:-1455}
      ADAM_CHATGPT_CALLBACK_LISTEN_HOST: 0.0.0.0
      ADAM_CHATGPT_CALLBACK_LISTEN_PORT: 1455
    ports:
      # Published on the host loopback only, so the callback is reached at 127.0.0.1.
      - "127.0.0.1:${ADAM_CHATGPT_CALLBACK_PORT:-1455}:1455"
    volumes:
      - ./data:/data
    secrets:
      - opencode_api_key
    depends_on:
      - search
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  search:
    image: docker.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${ADAM_SEARXNG_SECRET:-adam-internal-search}
    volumes:
      - ./search/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${ADAM_SEARCH_PORT:-8888}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      ADAM_INTERNAL_API_BASE: http://api:8000
    ports:
      - "127.0.0.1:${ADAM_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  opencode_api_key:
    file: ./secrets/opencode_api_key
